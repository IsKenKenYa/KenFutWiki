name: Demo Deploy

# demo 站持续部署：push 到 main/dev 即构建镜像并部署到 LHY-FutureServer（101.96.229.199），
# 不依赖 tag，方便调试与高频更新。发布流水线（tag 触发）见 backend.yml / web.yml。

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: demo-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: kenfutwiki
  # 部署目标 compose 目录与栈内 compose 文件名（服务器 kenfutwiki 用户 home 下）
  DEPLOY_DIR: /home/kenfutwiki/kenfutwiki
  COMPOSE_FILE: docker-compose.demo.yml

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Compute image tag
        id: tag
        run: |
          set -euo pipefail
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build-backend:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        service: [api, consumer]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 只构建 linux/amd64：demo 服务器是 x86_64，跳过 arm64 缩短构建时间
      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:demo
          build-args: |
            VERSION=${{ needs.version.outputs.tag }}
          cache-from: |
            type=gha,scope=demo-${{ matrix.service }}
          cache-to: |
            type=gha,scope=demo-${{ matrix.service }},mode=max

  build-web:
    runs-on: ubuntu-latest
    needs: version
    strategy:
      fail-fast: false
      matrix:
        project: [admin, app]
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cd web/admin
          echo "VITE_APP_VERSION=${{ needs.version.outputs.tag }}" >> .env.production
          cd ..
          pnpm run build

      - name: Prepare build context (${{ matrix.project }})
        run: |
          set -euo pipefail
          cd web/${{ matrix.project }}
          if [[ "${{ matrix.project }}" == "admin" ]]; then
            # admin 镜像把 dist 与 ssl 都 COPY 进镜像；demo 无自定义证书，放空占位
            mkdir -p ssl && touch ssl/.keep
          else
            # app 镜像期望 standalone 产物在 dist/ 下
            mkdir -p dist
            cp -r dist/standalone dist/static . 2>/dev/null || true
            ls -la
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.project }}
        uses: docker/build-push-action@v5
        with:
          context: ./web/${{ matrix.project }}
          file: ./web/${{ matrix.project }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_PREFIX }}-${{ matrix.project == 'admin' && 'nginx' || 'app' }}:demo
          cache-from: |
            type=gha,scope=demo-${{ matrix.project }}
          cache-to: |
            type=gha,scope=demo-${{ matrix.project }},mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [version, build-backend, build-web]
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          source: "deploy/demo/docker-compose.demo.yml,deploy/demo/nginx/kenfutwiki-demo.conf.template"
          target: ${{ env.DEPLOY_DIR }}
          strip_components: 2

      - name: Deploy stack
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_TAG: ${{ needs.version.outputs.tag }}
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -euo pipefail
            cd ${{ env.DEPLOY_DIR }}
            # compose 内镜像引用 docker.1ms.run/iskenkenya/*（Docker Hub 国内加速，
            # 服务器直连 Hub 超时）；pull 前登录代理不需要，公开镜像匿名可拉
            docker compose -f ${{ env.COMPOSE_FILE }} pull
            docker compose -f ${{ env.COMPOSE_FILE }} up -d --remove-orphans
            # 清理悬空镜像与旧构建缓存，防止磁盘被无用镜像占满
            docker image prune -f
            docker builder prune -f --filter until=168h
            echo "=== 栈状态 ==="
            docker compose -f ${{ env.COMPOSE_FILE }} ps

      - name: Reload nginx (vhost update)
        if: hashFiles('deploy/demo/nginx/kenfutwiki-demo.conf.template') != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEMO_SSH_HOST }}
          username: ${{ secrets.DEMO_SSH_USER }}
          key: ${{ secrets.DEMO_SSH_KEY }}
          script: |
            set -euo pipefail
            # vhost 模板渲染（DEMO 上游端口由服务器 .env 提供）后检测并平滑重载
            envsubst '$DEMO_APP_PORT,$DEMO_API_PORT' \
              < ${{ env.DEPLOY_DIR }}/kenfutwiki-demo.conf.template \
              > /www/server/panel/vhost/nginx/kenfutwiki-demo.conf
            sudo /www/server/nginx/sbin/nginx -t
            sudo /www/server/nginx/sbin/nginx -s reload
            echo "nginx reloaded"

  prune-tags:
    # Docker Hub 镜像 tag 保留策略：滚动 tag（latest/demo）永不删，
    # 每个大版本保留最近 10 个 tag，最多保留 20 个大版本，sha- 开发 tag 留最近 20 个。
    # 避免无端占用 Docker Hub 公开资源；老版本用户可从源码自行构建。
    runs-on: ubuntu-latest
    needs: [build-backend, build-web]
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prune old image tags
        env:
          HUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 -I .github/scripts/prune_hub_tags.py
