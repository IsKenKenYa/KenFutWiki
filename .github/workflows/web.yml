name: Web Build and Release

on:
  push:
    branches:
      - frontend-*
      - admin-*
      - app-*
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - main
    paths:
      - 'web/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag, e.g. v1.2.3 (default: sha-<short sha>)'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_PREFIX: kenfutwiki

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      stable: ${{ steps.get_version.outputs.STABLE }}

    steps:
      - name: Get version
        id: get_version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="sha-${GITHUB_SHA::7}"
          fi
          if [[ ! "${version}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid image tag '${version}'. Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1
          fi
          stable=false
          if [[ "${version}" == v* && "${version}" != *-* ]]; then
            stable=true
          fi
          {
            echo "VERSION=${version}"
            echo "STABLE=${stable}"
          } >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: [version]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('web/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          cd web
          pnpm install --frozen-lockfile --prefer-offline

      - name: Setup Env for admin
        run: |
          cd web/admin
          echo "VITE_APP_VERSION=${{ needs.version.outputs.version }}" >> .env.production

      - name: Build admin and app (parallel)
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          cd web
          pnpm run build

      - name: 'Tar admin files'
        run: tar -cvf web/admin/dist.tar web/admin/dist

      - name: Upload admin build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-build
          path: web/admin/dist.tar
          if-no-files-found: error
          include-hidden-files: true

      - name: 'Tar app files'
        run: tar -cvf web/app/dist.tar web/app/dist

      - name: Upload app build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: web/app/dist.tar
          if-no-files-found: error
          include-hidden-files: true

  package:
    needs: [build, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [admin, app]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.project }}-build

      - name: Extract files
        run: |
          tar -xvf dist.tar

      - name: Check file structure
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing web/${{ matrix.project }} directory:"
          ls -la web/${{ matrix.project }}
          echo "Listing web/${{ matrix.project }}/dist directory:"
          ls -la web/${{ matrix.project }}/dist

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve registries and tags
        id: image
        env:
          PROJECT: ${{ matrix.project }}
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          PUBLISH_DOCKERHUB: ${{ vars.PUBLISH_DOCKERHUB }}
          PUBLISH_GHCR: ${{ vars.PUBLISH_GHCR }}
          VERSION: ${{ needs.version.outputs.version }}
          STABLE: ${{ needs.version.outputs.stable }}
        run: |
          set -euo pipefail
          case "${PROJECT}" in
            admin) service=nginx ;;
            app) service=app ;;
            *)
              echo "::error::Unknown project '${PROJECT}'"
              exit 1
              ;;
          esac
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          namespace="${DOCKERHUB_NAMESPACE:-${owner}}"
          namespace="$(printf '%s' "${namespace}" | tr '[:upper:]' '[:lower:]')"
          images=()
          if [[ "${PUBLISH_DOCKERHUB:-true}" != "false" ]]; then
            images+=("docker.io/${namespace}/${IMAGE_PREFIX}-${service}")
          fi
          if [[ "${PUBLISH_GHCR:-false}" == "true" ]]; then
            images+=("ghcr.io/${owner}/${IMAGE_PREFIX}-${service}")
          fi
          if [[ ${#images[@]} -eq 0 ]]; then
            echo "::error::No image registry enabled; set PUBLISH_DOCKERHUB or PUBLISH_GHCR"
            exit 1
          fi
          tag_names=("sha-${GITHUB_SHA::7}")
          if [[ "${VERSION}" != "sha-${GITHUB_SHA::7}" ]]; then
            tag_names+=("${VERSION}")
          fi
          if [[ "${STABLE}" == "true" ]]; then
            tag_names+=("latest")
          fi
          tags=()
          for image in "${images[@]}"; do
            for tag in "${tag_names[@]}"; do
              tags+=("${image}:${tag}")
            done
          done
          {
            echo "images<<IMAGES_EOF"
            printf '%s\n' "${images[@]}"
            echo "IMAGES_EOF"
            echo "tags<<TAGS_EOF"
            printf '%s\n' "${tags[@]}"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        if: vars.PUBLISH_DOCKERHUB != 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: vars.PUBLISH_GHCR == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push
        uses: docker/build-push-action@v5
        with:
          context: ./web/${{ matrix.project }}
          file: ./web/${{ matrix.project }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.image.outputs.tags }}
          cache-from: |
            type=gha,scope=${{ matrix.project }}
          cache-to: |
            type=gha,scope=${{ matrix.project }},mode=max
