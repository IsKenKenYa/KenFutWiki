# KenFutWiki demo 站栈（LHY-FutureServer，kenfutwiki 用户维护）
# 域名映射：kenfutwiki-demo.future-you.top → app(3010)，wiki.future-you.top → nginx admin(8080)
# 宿主 80/443 归宝塔 nginx，由 vhost 反代到本栈；本栈不占用宿主低端口
# 镜像经 docker.1ms.run 加速（服务器直连 Docker Hub 超时）
# 数据隔离：独立 postgres/redis/nats 实例 + 独立卷，不碰 jaderun 的任何容器
# 镜像 tag 固定 demo，CI push main/dev 后自动 pull 更新
name: kenfutwiki-demo

x-image: &image-base docker.1ms.run/iskenkenya

services:
  postgres:
    # zhparser 中文分词变体（全文检索依赖）；chaitin 杭州 registry 国内直连可用，
    # 1ms.run 加速只覆盖 Docker Hub，私有 registry 路径透传失败
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/postgres-zhparser:17.6-bookworm
    container_name: kenfutwiki-demo-postgres
    restart: always
    environment:
      - POSTGRES_USER=panda-wiki
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=panda-wiki
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "panda-wiki", "-d", "panda-wiki"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m
    networks:
      demo-net:
        aliases:
          - panda-wiki-postgres

  redis:
    image: docker.1ms.run/library/redis:7.4.2-alpine
    container_name: kenfutwiki-demo-redis
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    mem_limit: 128m
    networks:
      demo-net:
        aliases:
          - panda-wiki-redis
          # admin 内置 nginx 的 upstream 硬编码 panda-wiki-minio:9000，
          # 启动时 DNS 必须可解析；demo 用雨云 S3 直连，此别名仅保证
          # nginx 能启动（/static-file/ 请求会打到 redis 被拒，属预期）
          - panda-wiki-minio

  nats:
    # 用官方发行版的 chaitin 变体（内置 jetstream 配置），与生产 compose 一致
    image: chaitin-registry.cn-hangzhou.cr.aliyuncs.com/chaitin/panda-wiki-nats:2.11.3-alpine
    container_name: kenfutwiki-demo-nats
    restart: always
    command: ["nats-server", "-c", "/etc/nats/nats.conf", "--user", "panda-wiki", "--pass", "${NATS_PASSWORD}"]
    volumes:
      - nats-data:/data
    mem_limit: 128m
    networks:
      demo-net:
        aliases:
          - panda-wiki-nats

  caddy:
    # KB「服务监听方式」同步目标（生产架构：宝塔 nginx → caddy → app/api）。
    # api 经 CADDY_API 调 admin API 下发反代路由；宿主宝塔 vhost 反代到
    # 127.0.0.1:9080（caddy 80），流量按域名分流到 app/api/静态资源
    image: docker.1ms.run/library/caddy:2.10.0-alpine
    container_name: kenfutwiki-demo-caddy
    restart: always
    ports:
      - "127.0.0.1:9080:80"
    volumes:
      # 仅含 admin endpoint（0.0.0.0:2019，容器内 TCP）；站点配置全由 api 下发
      - ./caddy/caddy.json:/etc/caddy/caddy.json:ro
      - caddy-data:/data
    # 镜像默认入口读 /etc/caddy/Caddyfile（空配置），显式指向挂载的 JSON
    command: ["caddy", "run", "--config", "/etc/caddy/caddy.json"]
    mem_limit: 64m
    networks:
      demo-net:
        aliases:
          - panda-wiki-caddy

  app:
    image: ${REGISTRY_PREFIX:-docker.1ms.run/iskenkenya}/kenfutwiki-app:demo
    container_name: kenfutwiki-demo-app
    restart: always
    depends_on:
      - api
    environment:
      # 服务端渲染/代理的 API 目标（httpClient baseUrl 与 proxy 转发都用 TARGET）
      - TARGET=http://panda-wiki-api:8000
    ports:
      # 宿主 80 端口归宝塔 nginx，反代目标绑回环，不暴露公网
      - "127.0.0.1:3010:3010"
    mem_limit: 400m
    networks:
      demo-net:
        aliases:
          - panda-wiki-app

  api:
    image: ${REGISTRY_PREFIX:-docker.1ms.run/iskenkenya}/kenfutwiki-api:demo
    container_name: kenfutwiki-demo-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 默认 NATS 地址按 SUBNET_PREFIX 拼 IP（生产容器网段），demo 用网络别名覆盖
      - MQ_NATS_SERVER=nats://panda-wiki-nats:4222
      - NATS_PASSWORD=${NATS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      # KB 监听配置同步到本栈 caddy（TCP admin，容器内 2019）
      - CADDY_API=tcp://panda-wiki-caddy:2019
      # caddy 反代上游：api/app 在同一网络用别名；静态资源走雨云 S3
      # （caddy 路由 transport 是 http，HTTPS 域名需带 443 端口；demo 桶
      # 自定义名走 S3_PUBLIC_URL 直连，此 upstream 仅保证配置完整）
      - CADDY_UPSTREAM_API=panda-wiki-api:8000
      - CADDY_UPSTREAM_APP=panda-wiki-app:3010
      - CADDY_UPSTREAM_STATIC=${CADDY_UPSTREAM_STATIC}
      - RAG_CT_RAG_BASE_URL=${RAG_CT_RAG_BASE_URL}
      - RAG_CT_RAG_API_KEY=${RAG_CT_RAG_API_KEY}
      # 对象存储：雨云 S3（demo 专用 bucket 按需在管理端存储页配置）
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - S3_REGION=${S3_REGION}
      - S3_SECURE=${S3_SECURE}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL}
      - GOMEMLIMIT=350MiB
    mem_limit: 450m
    networks:
      demo-net:
        aliases:
          # admin 镜像内置 nginx 的 upstream 指向 panda-wiki-api:8000
          - panda-wiki-api

  consumer:
    image: ${REGISTRY_PREFIX:-docker.1ms.run/iskenkenya}/kenfutwiki-consumer:demo
    container_name: kenfutwiki-demo-consumer
    restart: always
    depends_on:
      - api
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - MQ_NATS_SERVER=nats://panda-wiki-nats:4222
      - NATS_PASSWORD=${NATS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - RAG_CT_RAG_BASE_URL=${RAG_CT_RAG_BASE_URL}
      - RAG_CT_RAG_API_KEY=${RAG_CT_RAG_API_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - GOMEMLIMIT=200MiB
    mem_limit: 260m
    networks:
      demo-net: {}

  admin:
    # admin 镜像 = nginx + 静态管理端；内部监听 8080（自签证书 ssl http2）
    image: ${REGISTRY_PREFIX:-docker.1ms.run/iskenkenya}/kenfutwiki-nginx:demo
    container_name: kenfutwiki-demo-admin
    restart: always
    depends_on:
      - api
    ports:
      # 反代目标绑回环；宝塔侧用 proxy_ssl_verify off 对接自签证书
      - "127.0.0.1:8080:8080"
    mem_limit: 64m
    networks:
      demo-net:
        aliases:
          # admin 内置 nginx upstream 硬编码 panda-wiki-api / panda-wiki-minio，
          # 启动时必须可解析（minio 别名挂在 redis 上，见其注释）
          - panda-wiki-nginx

networks:
  demo-net:
    name: kenfutwiki-demo-net
    driver: bridge

volumes:
  postgres-data:
    name: kenfutwiki-demo-pg-data
  nats-data:
    name: kenfutwiki-demo-nats-data
  caddy-data:
    name: kenfutwiki-demo-caddy-data
