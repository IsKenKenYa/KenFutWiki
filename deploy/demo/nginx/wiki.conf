# wiki.future-you.top → demo 管理端（admin 容器 8080，镜像内自签证书 ssl http2）
# 部署位置：/www/server/panel/vhost/nginx/wiki.conf
# 上游是自签 HTTPS，必须 proxy_ssl_verify off；宝塔负责对外真证书
server {
    listen 80;
    server_name wiki.future-you.top;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/html;
    }

    location / {
        proxy_pass https://127.0.0.1:8080;
        proxy_ssl_verify off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（聊天回答流式输出）
        proxy_buffering off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        client_max_body_size 1000m;
    }
}
