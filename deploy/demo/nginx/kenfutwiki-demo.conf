# kenfutwiki-demo.future-you.top → demo 公开站（app 容器 3010，HTTP 明文）
# 部署位置：/www/server/panel/vhost/nginx/kenfutwiki-demo.conf
# SSL 由宝塔面板申请（Let's Encrypt）后合并进此文件，或用模板渲染时生成 443 server 块
server {
    listen 80;
    server_name kenfutwiki-demo.future-you.top;

    # 宝塔 ACME 验证路径放行
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/html;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE/流式回答与 Next 资源加载
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 100m;
    }
}
